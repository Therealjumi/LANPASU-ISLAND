// Growth follows Kimah checkpoints precisely; every Alz is an interpolated step.
// Monotone cubic interpolation prevents steps and overshoot at Kimah boundaries.
function lanpasuSmoothGrowthCm(age){
 const pts=LANPASU_GROWTH_CM;
 const a=Math.max(0,Math.min(12,Number(age)||0));
 if(a>=12)return pts[12][1];
 const i=Math.floor(a),t=a-i, y0=pts[i][1],y1=pts[i+1][1];
 const m=y1-y0;
 const tangent=k=>{
  if(k>=12)return 0; // shared juvenile growth eases into puberty
  if(k<=0)return pts[1][1]-pts[0][1];
  const prev=pts[k][1]-pts[k-1][1],next=pts[k+1][1]-pts[k][1];
  return prev>0&&next>0?2*prev*next/(prev+next):0;
 };
 const d0=tangent(i),d1=tangent(i+1),t2=t*t,t3=t2*t;
 return (2*t3-3*t2+1)*y0+(t3-2*t2+t)*d0+(-2*t3+3*t2)*y1+(t3-t2)*d1;
}
function lanpasuHeightProgress(age){const t=Math.max(0,Math.min(1,(age-12)/6));return t*t*(3-2*t);}
function lanpasuElderLossCm(age){const t=Math.max(0,Math.min(1,(age-40)/60));return 6.35*t*t*(3-2*t);}

function currentHeightCm(){

}

function validate(raw){const p=blank();if(!raw||typeof raw!=='object')return p;
 for(const k of ['firstName','lastName'])p[k]=String(raw[k]||'').slice(0,60);

  const incomingAlz=raw.ageAlz!==undefined?raw.ageAlz:(raw.age===undefined?6480:Number(raw.age)*LANPASU_ALZ_PER_KIMAH);
  syncAgeAlz(p,incomingAlz);
 if(BASES.includes(raw.foundation))p.foundation=raw.foundation;
 if(Array.isArray(raw.mbti)&&raw.mbti.length===4){const pairs=[['E','I'],['S','N'],['T','F'],['J','P']];p.mbti=raw.mbti.map((v,i)=>pairs[i].includes(v)?v:p.mbti[i]);}

 for(const k of geneKeys){const n=Number(raw.genes?.[k]);if(Number.isFinite(n))p.genes[k]=Math.round(Math.max(0,Math.min(100,n)));}
 if(/^Hair_0(?:[0-2][0-9]|3[0-7])$/.test(raw.hair))p.hair=raw.hair;
 if(raw.hairFit&&typeof raw.hairFit==='object')p.hairFit={scale:Math.max(85,Math.min(115,Math.round(Number(raw.hairFit.scale)||100))),y:Math.max(-30,Math.min(30,Math.round(Number(raw.hairFit.y)||0))),z:Math.max(-30,Math.min(30,Math.round(Number(raw.hairFit.z)||0)))};
 if(typeof raw.outfit==='string')p.outfit=raw.outfit.slice(0,90);
 if(STYLES.includes(raw.movement))p.movement=raw.movement;
 if(ACTIONS.includes(raw.action))p.action=raw.action;
 return p;
}

function render(){nav();if(page==='Identity')identityPanel();else if(page==='Body')bodyPanel();else if(page==='Face')facePanel();else if(page==='Hair')hairPanel();else if(page==='Skin & Color')colorsPanel();else if(page==='Clothing')clothingPanel();else if(page==='Movement')movementPanel();else if(page==='Personality')personalityPanel();else finishPanel();refreshChrome();}
const editorScrollByPage=new Map();
function setPage(p){
 if(!CATEGORY.includes(p))return;
 if($('editor'))editorScrollByPage.set(page,$('editor').scrollTop);
 const same=p===page;page=p;render();
 if($('editor'))$('editor').scrollTop=same?(editorScrollByPage.get(p)||0):(editorScrollByPage.get(p)||0);
 if(isPhone()&&drawerState==='collapsed')setDrawer('mid');
 if(isPhone()){const tab=[...document.querySelectorAll('#mobileNav [data-page]')].find(b=>b.dataset.page===p);tab?.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});}
}
function updateSliderViews(k){const n=profile.genes[k];const out=$('val-'+k);if(out)out.innerHTML=`${n}<span>/100</span>`;const control=$('gene-'+k);if(control&&Number(control.value)!==n)control.value=n;if(k==='height'){const hReadout=$('ageHeightReadout');if(hReadout)hReadout.innerHTML=ageHeightNote();$('stageSubtitle').textContent=`${ageDisplay()} · ${profile.foundation} · ${heightDisplay()}`;const hint=$('editor')?.querySelector('.gene-row:has(#gene-height) + .hint');if(hint)hint.textContent=`${heightDisplay()} on ${profile.foundation} foundation`;}if(page==='Skin & Color'){for(const [id,color] of [['previewSkin',skinHex()],['previewHair',hairHex()],['previewEye',eyeHex()]])if($(id))$(id).style.background=color;}}
function skinHex(){const pigment=profile.genes.skinPigment/100,dark=profile.genes.skinDarkness/100;const r=Math.round(239-150*dark+12*pigment),g=Math.round(195-127*dark-8*pigment),b=Math.round(161-114*dark-14*pigment);return `rgb(${r},${g},${b})`;}
function hairHex(){const red=profile.genes.hairRed/100,d=profile.genes.hairDarkness/100;return `rgb(${Math.round(230-175*d+22*red)},${Math.round(209-180*d-48*red)},${Math.round(169-139*d-52*red)})`;}
function eyeHex(){const palette=['#9da9b3','#5689af','#4b997d','#8f744a','#342621'];const x=(profile.genes.eyeColor/100)*(palette.length-1),a=palette[Math.floor(x)],b=palette[Math.min(palette.length-1,Math.ceil(x))],t=x-Math.floor(x);const col=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const ca=col(a),cb=col(b);return `rgb(${ca.map((n,i)=>Math.round(n*(1-t)+cb[i]*t)).join(',')})`;}
function download(data,filename){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),2500);}
function exportLook(){download(profile,`LANPASU_${(profile.firstName||'Character').replace(/[^a-z0-9-]/gi,'_')}_PhaseF.json`);savedLook=clone(profile);info('Character profile exported. The file contains all 63 genes, identity, personality, hair ID and movement style.','good');}
function resetSection(){if(page==='Body')mutate(p=>Object.values(G.body).flat().forEach(([k])=>p.genes[k]=defaults[k]));else if(page==='Face')mutate(p=>Object.values(G.face).flat().forEach(([k])=>p.genes[k]=defaults[k]));else if(page==='Hair')mutate(p=>{p.hair='Hair_001';Object.values(G.hair).flat().forEach(([k])=>p.genes[k]=defaults[k]);});else if(page==='Skin & Color')mutate(p=>Object.values(G.color).flat().forEach(([k])=>p.genes[k]=defaults[k]));else if(page==='Movement')mutate(p=>{p.movement='Casual';p.action='Idle';});else if(page==='Personality')mutate(p=>{p.mbti=['E','N','F','P'];p.alignment='';});else if(page==='Identity')mutate(p=>{syncAgeAlz(p,6480);p.foundation='Neutral (Intersex)';});else return;render();info(`${page} reset.`, 'good');}
function randomSection(){
 const r=()=>Math.round(Math.random()*100);
 const keys=page==='Body'?Object.values(G.body).flat():page==='Face'?Object.values(G.face).flat():page==='Hair'?Object.values(G.hair).flat():page==='Skin & Color'?Object.values(G.color).flat():[];
 if(page==='Clothing'||page==='Finish'){info('Nothing in this section can be randomized until connected outfit choices are available.');return;}
 mutate(p=>{
  keys.forEach(([k])=>p.genes[k]=r());
  if(page==='Hair')p.hair=`Hair_${String(1+Math.floor(Math.random()*24)).padStart(3,'0')}`;
  if(page==='Movement')p.movement=STYLES[Math.floor(Math.random()*8)];
  if(page==='Identity'){syncAgeAlz(p,Math.floor(Math.random()*36001));p.foundation=BASES[Math.floor(Math.random()*3)];}
  if(page==='Personality'){p.mbti=[['E','I'],['S','N'],['T','F'],['J','P']].map(pair=>pair[Math.floor(Math.random()*2)]);p.alignment=ALIGNMENTS[Math.floor(Math.random()*9)];}
 });render();info(`${page} randomized.`, 'good');}

function undo(){if(!history.length)return;future.push(clone(profile));profile=history.pop();render();localSave();info('Undo applied.');}
function redo(){if(!future.length)return;history.push(clone(profile));profile=future.pop();render();localSave();info('Redo applied.');}
let pointerGene=null;
function dispatchInput(el){if(el.dataset.gene){const k=el.dataset.gene,n=Number(el.value);if(!geneKeys.includes(k)||!Number.isFinite(n))return;if(pointerGene!==k){snapshot();pointerGene=k;}profile.genes[k]=Math.min(100,Math.max(0,Math.round(n)));updateSliderViews(k);finishChange();return;}
 if(el.dataset.field){const key=el.dataset.field;profile[key]=el.value.slice(0,60);finishChange();return;}
 if(el.id==='firstName'||el.id==='lastName'){profile[el.id]=el.value.slice(0,60);finishChange();return;}
 if(el.id==='ageSlider'||el.id==='ageNumber'){if(pointerGene!=='age'){snapshot();pointerGene='age';}syncAgeAlz(profile,el.value);if($('ageSlider'))$('ageSlider').value=profile.ageAlz;if($('ageNumber'))$('ageNumber').value=profile.ageAlz;const note=$('ageAlzStage');if(note)note.innerHTML=`<strong>${ageDisplay()}</strong>`;lanpasuRefreshStageButtons();finishChange();}
}
document.addEventListener('focusin',e=>{if(e.target.matches('input[data-field],#firstName,#lastName')){snapshot();pointerGene='text';}});

 if(e.target.id==='fileImport'&&e.target.files?.[0]){const file=e.target.files[0];file.text().then(s=>{try{const obj=JSON.parse(s);snapshot();profile=validate(obj);render();localSave();info(`Loaded look: ${file.name}`,'good');}catch(err){info('Look file could not be read as LANPASU JSON.','error');}});e.target.value='';}

 if(e.target.id==='hairFiles'&&e.target.files?.length){window.stageController?.registerHair?.(Array.from(e.target.files));e.target.value='';}

});
document.addEventListener('input',e=>{if(!e.target.matches('[data-hairfit]'))return;const k=e.target.dataset.hairfit;const val=Number(e.target.value);if(!['scale','y','z'].includes(k))return;if(pointerGene!=='hairFit-'+k){snapshot();pointerGene='hairFit-'+k;}if(!profile.hairFit)profile.hairFit={scale:100,y:0,z:0};profile.hairFit[k]=val;const out=$('fit-'+k);if(out)out.textContent=val+(k==='scale'?'%':'mm');finishChange();});
document.addEventListener('pointerup',()=>{pointerGene=null;});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.ageStageAlz!==undefined){mutate(p=>syncAgeAlz(p,Number(b.dataset.ageStageAlz)));render();return;}
 if(b.dataset.page){setPage(b.dataset.page);return;}
 if(b.id==='mobileIdentity'){setPage('Identity');return;}
 if(b.id==='mobilePersonality'){setPage('Personality');return;}
 if(b.id==='mobileFinish'){setPage('Finish');return;}
 if(b.dataset.bodygroup){sub=b.dataset.bodygroup;render();return;}
 if(b.dataset.facegroup){faceGroup=b.dataset.facegroup;render();return;}
 if(b.dataset.foundation){mutate(p=>p.foundation=b.dataset.foundation);render();return;}
 if(b.dataset.hair){mutate(p=>p.hair=b.dataset.hair);render();return;}
 if(b.id==='uploadHairFile'){$('hairFiles').click();return;}
 if(b.dataset.movement){mutate(p=>p.movement=b.dataset.movement);render();return;}
 if(b.dataset.action){mutate(p=>p.action=b.dataset.action);render();return;}
 if(b.dataset.letterIndex!==undefined){const i=Number(b.dataset.letterIndex);mutate(p=>p.mbti[i]=b.dataset.letter);render();return;}
 if(b.dataset.alignment){mutate(p=>p.alignment=b.dataset.alignment);render();return;}
 if(b.dataset.view){document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x.dataset.view===b.dataset.view));window.stageController?.view?.(b.dataset.view);return;}
 if(b.dataset.zoom){window.stageController?.zoom?.(Number(b.dataset.zoom));return;}
 if(b.id==='openMbti'||b.id==='openAlignment'){setPage('Personality');return;}
 if(b.id==='undo'){undo();return;}if(b.id==='redo'){redo();return;}
 if(b.id==='randomize'){randomSection();return;}if(b.id==='resetSection'){resetSection();return;}
 if(b.id==='saveLook'||b.id==='exportCharacter'){exportLook();return;}
 if(b.id==='loadLook'){$('fileImport').click();return;}
 if(b.id==='finishBtn'){setPage('Finish');return;}
 if(b.id==='loadModel'){$('modelFile').click();return;}
});
restoreLocal();render();info('Phase F editor ready. Open the hosted kit for the actual E.3 animated 3D preview. Your edits are saved locally and can be exported.');
window.LANPASU_F={profile:()=>clone(profile),geneKeys,receiveStage:(label)=>{liveLabel=label;refreshChrome();},color:()=>({skin:skinHex(),hair:hairHex(),eye:eyeHex()}),setNotice:info};

/* Phase F v002: sticky canvas, moving bottom sheet. The sheet is purely UI;
   no camera position, orbit target, zoom, renderer or character are changed here. */
const phoneMedia=window.matchMedia('(max-width:760px) and (orientation:portrait)');
const isPhone=()=>phoneMedia.matches;
let drawerState='mid',drawerGesture=null;
const drawerStates=['collapsed','mid','expanded'];
function drawerHeightFor(state){
 const vh=window.innerHeight,topSafe=70;
 if(state==='collapsed')return 98+Math.max(0,Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat'))||0);
 if(state==='expanded')return Math.min(vh-topSafe,Math.round(vh*.83));
 return Math.max(320,Math.min(Math.round(vh*.51),Math.round(vh*.62)));
}
function setDrawer(state,animate=true){
 if(!drawerStates.includes(state))return;
 drawerState=state;
 const d=$('mobileDrawer');d.dataset.state=state;
 d.style.removeProperty('height');
 document.getElementById('app').style.setProperty('--drawer-height',drawerHeightFor(state)+'px');
 d.classList.toggle('dragging',!animate);
 $('drawerGrab').setAttribute('aria-expanded',String(state!=='collapsed'));
 $('drawerGrab').setAttribute('aria-label',state==='expanded'?'Collapse customization options':state==='collapsed'?'Expand customization options':'Drag options upward or downward to resize');
 if(animate)setTimeout(()=>d.classList.remove('dragging'),230);
}
function setupMobileDrawer(){
 const d=$('mobileDrawer');
 const dock={nav:$('mobileNav'),editor:document.querySelector('.editor-rim'),actions:document.querySelector('.bottom')};
 const anchors=Object.fromEntries(Object.entries(dock).map(([k,v])=>{const anchor=document.createComment('Phase F '+k+' desktop placement');v.parentNode.insertBefore(anchor,v);return [k,anchor];}));
 function relocate(){
  if(isPhone()){
   $('mobileNavMount').appendChild(dock.nav);$('mobileEditorMount').appendChild(dock.editor);$('mobileActionsMount').appendChild(dock.actions);
   setDrawer(drawerState,false);
  }else{for(const [k,anchor] of Object.entries(anchors))anchor.parentNode.insertBefore(dock[k],anchor.nextSibling);}
 }
 phoneMedia.addEventListener?.('change',relocate);
 window.addEventListener('resize',()=>{if(isPhone()&&!drawerGesture)setDrawer(drawerState,false)},{passive:true});
 relocate();
 const grip=$('drawerGrab');
 grip.addEventListener('pointerdown',e=>{
  if(!isPhone()||e.button!==0)return;
  drawerGesture={id:e.pointerId,y:e.clientY,from:drawerHeightFor(drawerState),moved:false};
  grip.setPointerCapture(e.pointerId);d.classList.add('dragging');
 });
 grip.addEventListener('pointermove',e=>{
  if(!drawerGesture||e.pointerId!==drawerGesture.id)return;
  const distance=drawerGesture.y-e.clientY;
  if(Math.abs(distance)>8)drawerGesture.moved=true;
  if(!drawerGesture.moved)return;
  const newHeight=Math.min(drawerHeightFor('expanded'),Math.max(drawerHeightFor('collapsed'),drawerGesture.from+distance));
  $('app').style.setProperty('--drawer-height',newHeight+'px');
  d.style.height=newHeight+'px';
 });
 function releaseDrawer(e){
  if(!drawerGesture||e.pointerId!==drawerGesture.id)return;
  const v=drawerGesture;drawerGesture=null;d.classList.remove('dragging');
  if(!v.moved){setDrawer(drawerStates[(drawerStates.indexOf(drawerState)+1)%3]);return;}
  const height=v.from+v.y-e.clientY;
  const chosen=drawerStates.reduce((best,state)=>Math.abs(drawerHeightFor(state)-height)<Math.abs(drawerHeightFor(best)-height)?state:best,'mid');
  setDrawer(chosen);
 }
 grip.addEventListener('pointerup',releaseDrawer);grip.addEventListener('pointercancel',releaseDrawer);
 grip.addEventListener('keydown',e=>{if(!isPhone())return;if(e.key==='Enter'||e.key===' '){e.preventDefault();setDrawer(drawerStates[(drawerStates.indexOf(drawerState)+1)%3]);}if(e.key==='ArrowUp'){e.preventDefault();setDrawer(drawerStates[Math.min(2,drawerStates.indexOf(drawerState)+1)]);}if(e.key==='ArrowDown'){e.preventDefault();setDrawer(drawerStates[Math.max(0,drawerStates.indexOf(drawerState)-1)]);}});
}
window.LANPASU_F_MOBILE={setDrawer,drawerState:()=>drawerState,isPhone};

setupMobileDrawer();
</script><script>/* Added by Phase F v003: links the approved controls to the embedded E-C model. */
let F3Core=null,F3Pending=null,F3Frame=null,F3FitKey='',F3LastNotice='';
function realCore(){try{return document.getElementById('realModelFrame')?.contentWindow?.LANPASU_CORE||null;}catch(_){return null;}}
function F3Sync(p){F3Pending=p;const core=realCore();if(!core)return;try{if(core.version!=='v020-alz-growth'){const el=document.getElementById('ageBridgeStatus');if(el)el.textContent='Outdated Core detected: replace both v020 HTML files.';return;}core.sync(p);const f=p.hairFit||{scale:100,y:0,z:0};const k=[f.scale,f.y,f.z].join(',');if(k!==F3FitKey){F3FitKey=k;core.setHairFit(f.scale/100,f.y/1000,f.z/1000);}}catch(e){console.error('F3 core sync',e);}}
let F3Synced=false;
window.stageController={sync:p=>{F3Pending=p;if(F3Synced)return;F3Synced=true;requestAnimationFrame(()=>{F3Synced=false;if(F3Pending)F3Sync(F3Pending);});},
 view:v=>realCore()?.view(v),zoom:v=>realCore()?.zoom(v),loadFile:f=>realCore()?.loadFile(f),tryHair:id=>realCore()?.loadHair(id),registerHair:files=>realCore()?.registerHair(files),qa:()=>realCore()?.qa()};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==document.getElementById('realModelFrame')?.contentWindow)return;const x=e.data;if(!x||x.source!=='LANPASU_F3')return;
 if(x.kind==='bridgeReady'){F3Sync(window.LANPASU_F.profile());window.LANPASU_F.receiveStage('Preparing real E-C character…');const el=document.getElementById('assetConnectionStatus');if(el)el.textContent='Character: loading · Animations: waiting';}
 if(x.kind==='progress'){window.LANPASU_F.receiveStage(String(x.detail));}
 if(x.kind==='ready'){document.body.classList.add('core-ready3d');document.getElementById('poster').style.display='none';window.LANPASU_F.receiveStage('E-C real character · facial/body genes + fitted outfits');const el=document.getElementById('assetConnectionStatus');if(el)el.textContent='Character ✓ · 63 genetics ✓ · Animations: loading';F3FitKey='';F3Sync(window.LANPASU_F.profile());}
 if(x.kind==='error'){window.LANPASU_F.receiveStage('Character could not load');const el=document.getElementById('assetConnectionStatus');if(el)el.textContent='Connection failed · '+String(x.detail).slice(0,110);window.LANPASU_F.setNotice(String(x.detail),'error');}
 if(x.kind==='hair'){const n=document.getElementById('hairConnectionMessage');if(n)n.textContent=String(x.detail);}
 if(x.kind==='outfit'){const t=String(x.detail||'');if(t.includes('did not load'))window.LANPASU_F.setNotice(t,'error');else if(t.includes('connected'))window.LANPASU_F.setNotice('Original age-fitting clothes are ready 🤍','good');}
 if(x.kind==='outfit'){const t=String(x.detail||'');if(t.includes('did not load'))window.LANPASU_F.setNotice(t,'error');else if(t.includes('connected'))window.LANPASU_F.setNotice('Original age-fitting clothes are ready 🤍','good');}
 if(x.kind==='age'){window.LANPASU_AGE_STATUS=String(x.detail);const n=document.getElementById('ageBridgeStatus');if(n)n.textContent=window.LANPASU_AGE_STATUS;if(String(x.detail).startsWith('Age connection failed'))window.LANPASU_F.setNotice(String(x.detail),'error');}
 if(x.kind==='motion'&&typeof x.detail==='string'){const el=document.getElementById('assetConnectionStatus');if(el&&x.detail.includes('/32'))el.textContent='Character ✓ · 63 genetics ✓ · '+x.detail+' ✓';if(x.detail.includes('/32'))window.LANPASU_F.setNotice('Animation integration: '+x.detail,'good');else if(x.detail.includes('could not load')){if(el)el.textContent='Character ✓ · 63 genetics ✓ · '+x.detail;window.LANPASU_F.setNotice(x.detail,'error');}}
});
</script></body></html>
