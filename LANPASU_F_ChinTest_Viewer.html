<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>LANPASU · Chin Connection Test v005</title>
<style>
html,body{margin:0;min-height:100%;background:#e5eeea;color:#365961;font:15px/1.5 system-ui,sans-serif}
main{max-width:530px;margin:20vh auto;padding:22px;text-align:center}
.loading{height:5px;background:#c3d7d0;border-radius:5px;overflow:hidden}.loading:before{content:'';display:block;width:45%;height:100%;background:#479b97;animation:loading 1.5s ease-in-out infinite alternate}@keyframes loading{to{transform:translateX(130%)}}
small{color:#66817d}#errors{white-space:pre-wrap;text-align:left;color:#873b42}
</style>
</head><body><main id="loading"><h2>LANPASU · Chin Test</h2><p>Opening the real Phase F creator in isolated testing mode…</p><div class="loading"></div><p><small>This test leaves the main character creator unchanged.</small></p><p id="errors" role="alert"></p></main>
<script>
'use strict';
// Phase F compatible tester: load the authentic hosted creator at runtime,
// change only the embedded core source, +2 Face → Jaw & Chin genes, and
// give the test its own saved profile key. Never writes to the main creator.
(async()=>{
 try{
  const src='./LANPASU_Phase_F_Character_Creator_Interface.html';
  const res=await fetch(src,{cache:'no-store'});
  if(!res.ok)throw Error('The original creator was not found in this GitHub folder (HTTP '+res.status+').');
  let html=await res.text();
  function exactlyOnce(a,b){
   const n=html.split(a).length-1;
   if(n!==1)throw Error('Phase F creator version mismatch: expected 1 occurrence of '+a.slice(0,76)+', found '+n);
   html=html.replace(a,b);
  }
  exactlyOnce('src="./LANPASU_F_RealModel_Core.html"','src="./LANPASU_F_ChinTest_Core.html"');
  exactlyOnce("['chinProjection','Chin projection']]","['chinProjection','Chin projection'],['chinLength','Chin length'],['chinShape','Chin shape']]");
  exactlyOnce('geneKeys.length!==61||new Set(geneKeys).size!==61','geneKeys.length!==63||new Set(geneKeys).size!==63');
  exactlyOnce('Expected 61 non-duplicated genetic controls.','Expected 63 non-duplicated genetic controls.');
  exactlyOnce("let profile=blank(),page='Identity',sub='Build & height',faceGroup='Eyes'", "let profile=blank(),page='Face',sub='Build & height',faceGroup='Jaw & chin'");
  exactlyOnce('Character Creator · Phase F v003','Chin Test · Phase F v003');
  const saved='LANPASU_F_PROFILE';
  if((html.split(saved).length-1)!==2)throw Error('Unexpected profile persistence version; refusing to modify original creator.');
  html=html.split(saved).join('LANPASU_F_CHINTEST_PROFILE');
  // v005 ONE-TIME TEST RESET. Preserve saved character, hair, other 61 genes,
  // and profile history. The previous v004 extremes must not masquerade as
  // the neutral 50/50 test. Future slider changes are saved normally.
  try {
   const onceKey='LANPASU_F_CHINTEST_V005_CENTERED_ONCE';
   if(localStorage.getItem(onceKey)!=='yes'){
    const key='LANPASU_F_CHINTEST_PROFILE';
    const savedProfile=localStorage.getItem(key);
    if(savedProfile){
     const existing=JSON.parse(savedProfile);
     if(existing&&typeof existing==='object'){
      if(!existing.genes||typeof existing.genes!=='object')existing.genes={};
      existing.genes.chinLength=50;
      existing.genes.chinShape=50;
      localStorage.setItem(key,JSON.stringify(existing));
     }
    }
    localStorage.setItem(onceKey,'yes');
   }
  }catch(err){console.warn('Chin v005 reset: local profile storage unavailable',err);}
  // Document URL stays the tester's public GitHub Pages origin, so the
  // existing iframe sync(), postMessage and relative hosted GLB-part URLs work.
  document.open();document.write(html);document.close();
 }catch(e){
  const panel=document.getElementById('errors');
  if(panel)panel.textContent='Test viewer could not initialize: '+(e?.message||e)+'\nKeep the existing main creator untouched.';
 }
})();
</script></body></html>
